<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命运群星之夜 · Fate/stellar night</title>
<style>
  :root{
    --bg:#0d1220; --panel:#151c30; --panel2:#1a2340; --line:#2a3555;
    --ink:#e8e6df; --dim:#9aa3b8; --gold:#d4af37; --gold-soft:#b8963a;
    --red:#c0574f; --green:#5f9e6e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Source Han Serif SC","Noto Serif SC",Georgia,"Microsoft YaHei",serif;
    line-height:1.75; min-height:100vh;
  }
  #app{max-width:760px; margin:0 auto; padding:24px 16px 80px;}
  .screen{display:none;}
  .screen.on{display:block;}

  /* 标题页 */
  .screen#sc-title.on{position:relative; min-height:96vh; overflow:hidden;}
  .title-bg{
    position:absolute; inset:0; pointer-events:none;
    background:url("art/title.jpg") center 30%/cover no-repeat;
    opacity:.5;
  }
  .title-bg::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,14,26,.25) 0%, rgba(10,14,26,.05) 30%, var(--bg) 96%);
  }
  /* 插画横幅（宝具/遭遇战/仪式/终局） */
  .art-banner{
    margin:14px 0 4px; border:1px solid var(--gold-soft); border-radius:8px;
    overflow:hidden; position:relative; box-shadow:0 4px 26px rgba(0,0,0,.45);
    animation:artIn .9s ease both;
  }
  .art-banner img, .art-banner video{display:block; width:100%; height:auto; max-height:300px; object-fit:cover;}
  .art-banner .art-tag{
    position:absolute; left:0; bottom:0; padding:4px 14px 4px 10px;
    background:linear-gradient(90deg, rgba(10,14,26,.88), rgba(10,14,26,.0));
    color:var(--gold); font-size:12.5px; letter-spacing:3px;
  }
  @keyframes artIn{from{opacity:0; transform:translateY(10px) scale(1.015);}to{opacity:1; transform:none;}}
  .stars{position:absolute; inset:0; pointer-events:none;}
  .stars span{
    position:absolute; border-radius:50%; background:#e9dfb8;
    opacity:.2; animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.95;}}
  .title-wrap{position:relative; text-align:center; padding-top:9vh; z-index:1;}
  .grail{
    width:140px; height:140px; margin:0 auto 30px; border-radius:50%;
    background:radial-gradient(circle at 50% 32%, #4a3c15 0%, #241d0c 42%, rgba(13,18,32,0) 72%);
    border:1px solid rgba(212,175,55,.55); position:relative;
    animation:breath 4.5s ease-in-out infinite;
    box-shadow:0 0 60px rgba(212,175,55,.18), inset 0 0 30px rgba(212,175,55,.15);
  }
  .grail::before{
    content:""; position:absolute; inset:-16px; border-radius:50%;
    border:1px dashed rgba(212,175,55,.4);
    animation:orbit 26s linear infinite;
  }
  .grail::after{
    content:""; position:absolute; inset:30px; border-radius:50%;
    border:1px solid var(--gold); opacity:.65;
    box-shadow:inset 0 0 18px rgba(212,175,55,.5);
  }
  .grail i{
    position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px;
    border-radius:50%; background:var(--gold);
    box-shadow:0 0 12px 3px rgba(212,175,55,.8);
    animation:core 4.5s ease-in-out infinite;
  }
  @keyframes orbit{from{transform:rotate(0) scale(1);}50%{transform:rotate(180deg) scale(1.05);}to{transform:rotate(360deg) scale(1);}}
  @keyframes core{0%,100%{opacity:.7; transform:scale(1);}50%{opacity:1; transform:scale(1.5);}}
  @keyframes breath{0%,100%{box-shadow:0 0 30px rgba(212,175,55,.15);}50%{box-shadow:0 0 70px rgba(212,175,55,.4);}}
  h1.logo{
    font-size:40px; letter-spacing:14px; font-weight:600; margin-left:14px;
    background:linear-gradient(180deg,#f4e6b0 0%, #d4af37 55%, #8a6d1f 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(212,175,55,.25));
  }
  .ornament{
    display:flex; align-items:center; justify-content:center; gap:12px;
    margin:14px auto 12px; width:280px; color:var(--gold-soft);
  }
  .ornament::before,.ornament::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold-soft));}
  .ornament::after{background:linear-gradient(90deg,var(--gold-soft),transparent);}
  .sub{color:var(--dim); letter-spacing:5px; margin:0 0 42px; font-size:13.5px;}
  .btn{
    display:inline-block; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:10px 26px;
    font-size:15px; cursor:pointer; font-family:inherit; letter-spacing:2px;
    transition:border-color .2s, color .2s;
  }
  .btn:hover{border-color:var(--gold); color:var(--gold);}
  .btn.primary{border-color:var(--gold-soft); color:var(--gold);}
  .btn.small{padding:5px 14px; font-size:13px; letter-spacing:1px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-row{display:flex; gap:12px; justify-content:center; margin-top:14px; flex-wrap:wrap;}

  /* 抽取页 */
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin:14px 0;}
  .panel h3{color:var(--gold); font-size:15px; letter-spacing:3px; margin-bottom:10px; font-weight:600;}
  .kv{display:flex; gap:6px; font-size:14px; margin:2px 0;}
  .kv b{color:var(--gold-soft); font-weight:600; flex-shrink:0;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:14px;}
  .card{
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:16px; cursor:pointer; transition:transform .15s, border-color .2s;
  }
  .card:hover{transform:translateY(-4px); border-color:var(--gold);}
  .card .cls{color:var(--gold); font-size:20px; letter-spacing:3px; font-weight:600;}
  .card .tn{font-size:16px; margin:6px 0;}
  .card .src{color:var(--dim); font-size:12.5px;}
  .card .np{font-size:13px; color:var(--gold-soft); margin-top:8px;}
  .loading{color:var(--dim); text-align:center; padding:40px 0; letter-spacing:2px;}
  .dots::after{content:"…"; animation:dots 1.2s steps(4) infinite;}
  @keyframes dots{0%{content:"";}25%{content:"·";}50%{content:"··";}75%{content:"···";}}

  /* 状态栏 */
  .statusbar{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; margin-bottom:12px; font-size:13.5px;
  }
  .sb-row1{display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; color:var(--dim); margin-bottom:8px;}
  .sb-row1 .hl{color:var(--gold);}
  .bars{display:grid; grid-template-columns:1fr 1fr; gap:8px 18px;}
  .bar label{display:flex; justify-content:space-between; color:var(--dim); font-size:12px;}
  .bar .track{height:6px; background:#0a0e1a; border-radius:3px; overflow:hidden; margin-top:3px;}
  .bar .fill{height:100%; background:var(--gold-soft); border-radius:3px; transition:width .4s;}
  .bar.hp .fill{background:var(--red);}
  .bar.hp.sv .fill{background:var(--gold);}
  .spells{color:var(--gold); letter-spacing:4px; font-size:15px;}
  .spells .off{color:#333c55;}

  /* 叙事区 */
  .narration{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:20px 22px; margin-bottom:12px; white-space:pre-wrap; font-size:15.5px;
  }
  .narration .stamp{color:var(--gold); font-size:12.5px; letter-spacing:2px; display:block; margin-bottom:8px;}
  .intel{color:var(--dim); font-size:13px; padding:8px 4px 0; border-top:1px dashed var(--line); margin-top:12px; white-space:pre-wrap;}

  /* 选项 */
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:11px 16px; cursor:pointer; text-align:left; color:var(--ink);
    font-family:inherit; font-size:14.5px; transition:border-color .2s;
  }
  .opt:hover{border-color:var(--gold);}
  .opt.cmd{border-color:var(--gold-soft);}
  .custom-row{display:flex; gap:8px; margin-top:10px;}
  .custom-row input{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); padding:10px 14px; font-family:inherit; font-size:14px; outline:none;
  }
  .custom-row input:focus{border-color:var(--gold-soft);}

  /* 终局 */
  .ending-wrap{text-align:center; padding-top:8vh;}
  .ending-wrap h2{color:var(--gold); font-size:26px; letter-spacing:6px; margin-bottom:20px;}
  .verdict{white-space:pre-wrap; text-align:left; background:var(--panel); border:1px solid var(--gold-soft); border-radius:10px; padding:22px;}

  /* 模态 */
  .modal{position:fixed; inset:0; background:rgba(5,8,16,.8); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow:auto;}
  .modal.on{display:flex;}
  .modal .box{background:var(--panel); border:1px solid var(--line); border-radius:10px; max-width:520px; width:100%; padding:22px;}
  .modal h3{color:var(--gold); letter-spacing:3px; margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; color:var(--dim); font-size:12.5px; margin-bottom:4px;}
  .field input, .field select{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); padding:8px 12px; font-family:inherit; font-size:14px; outline:none;
  }
  .field input:focus{border-color:var(--gold-soft);}
  .hint{color:var(--dim); font-size:12px; margin-top:8px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:12.5px; color:var(--dim);}
  .err{color:var(--red); font-size:13px; margin-top:8px;}
  .mirror-banner{
    position:relative; z-index:5; max-width:720px; margin:10px auto 0;
    background:#2a2410; border:1px solid var(--gold-soft); border-radius:8px;
    padding:10px 16px; font-size:13px; color:var(--ink);
  }
  .mirror-banner a{color:var(--gold); text-decoration:underline;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
</style>
</head>
<body>
<div id="app">

  <!-- 标题 -->
  <div class="screen on" id="sc-title">
    <div class="title-bg"></div>
    <div class="stars" id="stars"></div>
    <div class="title-wrap">
      <div class="grail"><i></i></div>
      <h1 class="logo">命运群星之夜</h1>
      <div class="ornament">✦</div>
      <p class="sub">FATE / STELLAR NIGHT · AI 主理 · 七骑降临</p>
      <div class="btn-row">
        <button class="btn primary" id="btn-start">开始战争</button>
        <button class="btn" id="btn-continue">继续战争</button>
        <button class="btn" id="btn-lore">世界设定</button>
        <button class="btn" id="btn-ai-setup">AI 通道</button>
      </div>
      <p class="hint" id="title-hint" style="margin-top:26px;">御主，请就位。</p>
      <p id="visitor-foot" style="margin-top:16px;color:var(--dim);font-size:12.5px;letter-spacing:1px;"></p>
      <noscript><p class="err">需要启用 JavaScript。</p></noscript>
    </div>
  </div>

  <!-- 抽取 -->
  <div class="screen" id="sc-draw">
    <div class="topbar"><span>圣杯召唤仪式</span><span>— 群星之夜 —</span></div>
    <div id="draw-body"><div class="loading dots">正在叩响英灵座</div></div>
  </div>

  <!-- 主游戏 -->
  <div class="screen" id="sc-game">
    <div class="topbar">
      <span id="ver-mark">圣杯v1</span>
      <span>
        <button class="btn small" id="btn-save">存档</button>
        <button class="btn small" id="btn-ai-setup2">AI 通道</button>
        <button class="btn small" id="btn-end-war">终局确认</button>
      </span>
    </div>
    <div class="statusbar" id="statusbar"></div>
    <div id="log"></div>
    <div class="opts" id="opts"></div>
    <div class="custom-row" id="custom-row">
      <input id="custom-input" placeholder="自由行动（描述你的御主/英灵的行动）" maxlength="120">
      <button class="btn primary" id="btn-send">行动</button>
    </div>
  </div>

  <!-- 终局 -->
  <div class="screen" id="sc-ending">
    <div class="ending-wrap">
      <div id="ending-art"></div>
      <div class="grail" style="width:90px;height:90px;"></div>
      <h2 id="ending-title">圣杯裁决</h2>
      <div class="verdict" id="ending-verdict"></div>
      <div class="btn-row" style="margin-top:24px;">
        <button class="btn primary" id="btn-again">再临圣杯</button>
      </div>
    </div>
  </div>
</div>

<!-- 世界设定模态 -->
<div class="modal" id="md-lore">
  <div class="box">
    <h3>世界设定 · 新御主必读</h3>
    <div id="lore-body" style="white-space:pre-wrap;font-size:14px;"></div>
    <div class="btn-row" style="justify-content:flex-end;"><button class="btn small" id="btn-lore-close">关闭</button></div>
  </div>
</div>

<!-- AI 设置模态 -->
<div class="modal" id="md-ai">
  <div class="box">
    <h3>AI 通道设置</h3>
    <div class="field"><label>接口地址（OpenAI 兼容，含 /v1 则自动去掉尾部 /chat/completions）</label>
      <input id="ai-endpoint" placeholder="https://api.example.com/v1/chat/completions"></div>
    <div class="field"><label>API Key</label>
      <input id="ai-key" type="password" placeholder="sk-..."></div>
    <div class="field"><label>模型名称</label>
      <input id="ai-model" placeholder="例如 glm-5.3-flash / gpt-4o-mini"></div>
    <div class="hint">密钥仅存于本机 localStorage，直接从浏览器发往你填写的接口。</div>
    <div class="err" id="ai-test-err"></div>
    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn small" id="btn-ai-test">测试连通</button>
      <button class="btn small primary" id="btn-ai-save">保存</button>
      <button class="btn small" id="btn-ai-close">关闭</button>
    </div>
  </div>
</div>

<!-- 存档模态 -->
<div class="modal" id="md-save">
  <div class="box">
    <h3>战争记录（存档）</h3>
    <div id="save-slots"></div>
    <div class="btn-row" style="justify-content:flex-end;"><button class="btn small" id="btn-save-close">关闭</button></div>
  </div>
</div>

<script>
window.PUBLIC_CONFIG = {
  endpoint: "https://stellar-night.app.workbuddy.host",
  oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",

</script>

        if(c === "\\"){ if(t[i+1] === "n"){ out += "\n"; i+=2; continue; } out += t[i+1] || ""; i+=2; continue; }
        if(c === '"') break;
        out += c; i++;
      }
      if(out) return out;
    }
    return null;
  }
  function grabNum(key){
    var m = new RegExp('"'+key+'"\\s*:\\s*(-?[0-9.]+)').exec(t);
    return m ? parseFloat(m[1]) : null;
  }
  var narr = grabStr(["narration"]);
  if(!narr) return null;
  var scene = null, m2 = /"scene"\s*:\s*"(\w+)"/.exec(t);
  if(m2) scene = m2[1];
  var st = {
    day: grabNum("day"), phase: grabStr(["phase"]) || undefined,
    location: grabStr(["location"]) || undefined,
    masterHp: grabNum("masterHp"), masterMana: grabNum("masterMana"),
    servantHp: grabNum("servantHp"), servantMana: grabNum("servantMana"),
    scene: scene || undefined
  };
  var opts = [];
  var ore = /"label"\s*:\s*"((?:[^"\\]|\\.)*)"/g, om;
  while((om = ore.exec(t)) && opts.length < 6){
    opts.push({label: om[1].replace(/\\n/g," ").replace(/\\"/g,'"')});
  }
  return {narration:narr, state:st, options: opts.length ? opts : undefined};
}

/* ---------- 状态钳制 ---------- */
var SCENES = ["explore","battle","event","final","ending"];
var PHASE_ORDER = ["清晨","上午","午后","黄昏","夜","深夜"];
function clampState(oldG, raw){
  function num(v, old, min, max){
    v = Math.round(Number(v));
    if(!isFinite(v)) return old;
    return Math.max(min, Math.min(max, v));
  }
  function int1(v, old){ v = Math.round(Number(v)); return isFinite(v) ? v : old; }
  var s = raw && typeof raw === "object" ? raw.state || {} : {};
  var g = oldG;
  g.turn = (g.turn||0) + 1;
  g.day = num(s.day, g.day, 1, 14);
  if(s.phase){
    var alias = {"傍晚":"黄昏","半夜":"深夜","凌晨":"深夜","黎明":"清晨","正午":"午后","中午":"午后"};
    var ph = alias[s.phase] || s.phase;
    if(PHASE_ORDER.indexOf(ph) >= 0) g.phase = ph;
  }
  if(typeof s.location === "string" && s.location.trim()) g.location = s.location.trim().slice(0,20);
  g.masterHp = num(s.masterHp, g.masterHp, 0, 100);
  g.masterMana = num(s.masterMana, g.masterMana, 0, 100);
  g.servantHp = num(s.servantHp, g.servantHp, 0, 100);
  g.servantMana = num(s.servantMana, g.servantMana, 0, 100);
  if(s.scene && SCENES.indexOf(s.scene) >= 0) g.scene = s.scene;
  else if(g.scene === "ending") g.scene = "ending";
  // 时段引擎：每 3 回合强制推进（防模型偷懒冻结）
  if(g.turn % 3 === 0 && (!s.phase || PHASE_ORDER.indexOf(alias[s.phase] || s.phase) < 0)){
    var pi = PHASE_ORDER.indexOf(g.phase);
    if(pi >= 0){
      var ni = (pi + 1) % PHASE_ORDER.length;
      g.phase = PHASE_ORDER[ni];
      if(ni === 0) g.day = Math.min(14, g.day + 1);
      g._autoTime = true;
    }
  }
  // 战斗信息
  if(g.scene === "battle"){
    var b = raw.battle || {};
    g.battle = {
      enemyClass: (typeof b.enemyClass==="string" && b.enemyClass) ? b.enemyClass.slice(0,16) : (g.battle&&g.battle.enemyClass)||"???",
      enemyTrueName: (typeof b.enemyTrueName==="string") ? b.enemyTrueName.slice(0,24) : (g.battle&&g.battle.enemyTrueName)||"???",
      enemyMaster: (typeof b.enemyMaster==="string") ? b.enemyMaster.slice(0,16) : (g.battle&&g.battle.enemyMaster)||"???",
      enemyHp: num(b.enemyHp, (g.battle&&g.battle.enemyHp)||100, 0, 100),
      round: num(b.round, (g.battle&&g.battle.round||0)+1, 1, 40)
    };
  } else { g.battle = null; }
  // 阵营更新
  if(Array.isArray(raw.rosterUpdate)){
    raw.rosterUpdate.forEach(function(u){
      if(!u || typeof u !== "object") return;
      var idx = g.roster.findIndex(function(r){ return r.className === u.className; });
      if(idx < 0) return;
      if(typeof u.trueName === "string" && u.trueName && u.trueName !== "???") g.roster[idx].trueName = u.trueName.slice(0,24);
      if(u.status === "dead") g.roster[idx].status = "dead";
      else if(u.status === "alive") g.roster[idx].status = "alive";
      if(typeof u.masterName === "string" && u.masterName && u.masterName !== "???") g.roster[idx].masterName = u.masterName.slice(0,16);
    });
  }
  g.servantsLeft = g.roster.filter(function(r){ return r.status !== "dead"; }).length;
  // 情报
  if(typeof raw.unlockedIntel === "string" && raw.unlockedIntel.trim()){
    g.intel.push(raw.unlockedIntel.trim().slice(0, 160));
  }
  // 真相信线索（按 id 去重，最多5条）
  if(raw.clue && raw.clue.id && raw.clue.text && g.clues.length < 6){
    var cid = String(raw.clue.id).slice(0,4);
    if(!g.clues.some(function(c){ return c.id === cid; })){
      g.clues.push({id:cid, text:String(raw.clue.text).slice(0,60)});
    }
  }
  // 终局
  if(raw.ending && typeof raw.ending === "object" && raw.ending.verdict){
    g.ending = {
      title: (typeof raw.ending.title === "string" && raw.ending.title) ? raw.ending.title.slice(0,30) : "圣杯裁决",
      verdict: String(raw.ending.verdict).slice(0, 2400),
      wishGranted: !!raw.ending.wishGranted,
      trueEnding: !!raw.ending.trueEnding
    };
    g.scene = "ending";
  }
  // 插画信号（仅接受 np；用后即清）
  g._art = (raw && raw.art === "np" && g.servant) ? "np" : null;
  return g;
}
function clampOptions(raw, g){
  var opts = Array.isArray(raw.options) ? raw.options : [];
  var out = [];
  opts.forEach(function(o){
    if(o && typeof o.label === "string" && o.label.trim()){
      out.push({label:o.label.trim().slice(0,60), cmd:!!o.cmd});
    }
  });
  if(!out.length){
    // 兜底选项
    if(g.scene === "battle"){
      out = [{label:"正面强攻"},{label:"固守观察"},{label:"下令撤退"}];
    } else {
      out = [{label:"搜索敌方气息"},{label:"谨慎行动，巩固据点"}];
    }
  }
  return out.slice(0,6);
}

function beginDraw(){
  show("sc-draw");
  $("draw-body").innerHTML = '<div class="loading dots">正在叩响英灵座，命运的签正在摇动</div>';
  var fixedName = randomCNName();
  var spark = randomSpark(); // 命运签：防模型输出偏好导致英灵重复（如总抽到同一人）
  var banList = recentServants();
  if(G && G._draw && G._draw.servant){ var ln = G._draw.servant.trueName; if(banList.indexOf(ln) < 0) banList = [ln].concat(banList); }
  var userMsg = "执行开局召唤仪式：御主姓名已由命运轮盘定为「"+fixedName+"」（master.name 必须一字不差使用这个名字，不得改名）。本次命运签：「"+spark.sourceType+" · "+spark.era+"」——英灵的来源与出身必须与此一致。请给出该御主的出身/魔术属性/愿望，并给出单张英灵卡与本战全骑名册。";
  callAI([{role:"system", content:drawPrompt(spark, banList)},{role:"user", content:userMsg}], {mockDraw:true})
    .then(function(raw){
      var data = tryParseGM(raw);
      if(!data || !data.master || !data.servant && !(Array.isArray(data.servants) && data.servants.length)){
        data = salvageDraw(raw);
      }
      // 兼容模型仍输出 servants 数组的情况：取第一张
      if(data && !data.servant && Array.isArray(data.servants) && data.servants.length) data.servant = data.servants[0];
      if(!data || !data.master || !data.servant){
        throw new Error("召唤仪式解析失败");
      }
      normalizeDraw(data);
      data.master.name = fixedName; // 姓名以本地命运轮盘为准，模型取名偏执不生效
      G = freshGame();
      G._draw = data;
      renderDraw(data);
    })
    .catch(function(e){
      $("draw-body").innerHTML =
        '<div class="panel"><p class="err">'+esc(e.message||"召唤失败")+'</p>'+
        '<p class="hint">请检查「AI 通道」设置，或使用本地卡池（离线召唤）先体验。</p></div>'+
        '<div class="btn-row"><button class="btn primary" id="btn-offline">本地卡池召唤</button>'+
        '<button class="btn" id="btn-retry-draw">重试 AI 召唤</button></div>';
      $("btn-offline").onclick = function(){ G = freshGame(); normalizeDraw(mockDraw()); renderDraw(G._draw = mockDraw()); };
      $("btn-retry-draw").onclick = beginDraw;
    });
}
function salvageDraw(raw){
  var o = tryParseGM(raw);
  if(o && o.master && (o.servant || (Array.isArray(o.servants) && o.servants.length))){
    if(!o.servant && o.servants.length) o.servant = o.servants[0];
    return o;
  }
  // 打捞失败，走本地兜底
  return null;
}
function normalizeDraw(data){
  var m = data.master;
  m.name = String(m.name||"无名御主").slice(0,12);
  m.origin = String(m.origin||"来历不明").slice(0,60);
  m.element = String(m.element||"无").slice(0,6);
  m.mana = Math.max(50, Math.min(100, Math.round(Number(m.mana))||75));
  m.wish = String(m.wish||"未知").slice(0,40);
  var sv = data.servant;
  data.servant = {
    className: String(sv.className||"Caster").slice(0,16),
    trueName: String(sv.trueName||"无名英灵").slice(0,24),
    sourceType: String(sv.sourceType||"历史传说").slice(0,10),
    np: String(sv.np||"未知宝具").slice(0,40),
    stats: String(sv.stats||"—").slice(0,60),
    intro: String(sv.intro||"").slice(0,90)
  };
  if(!Array.isArray(data.roster) || !data.roster.length){
    data.roster = NORMAL_CLASSES.map(function(c){ return {className:c, trueName:null, status:"alive"}; });
  }
  // 确保玩家抽到的职阶在名册里
  if(!data.roster.some(function(r){ return r.className === data.servant.className; })){
    data.roster.push({className:data.servant.className, trueName:null, status:"alive"});
  }
}
function pickServant(){
  var data = G._draw;

  rememberServant(sv.trueName); // 近期英灵登记，防后续重复

  G.servant = sv;
  G.roster = data.roster.map(function(r){
    return {className:r.className||"???", trueName:(r.className===sv.className)?sv.trueName:(r.trueName||null),
      masterName:(r.className===sv.className)?G.master.name:(r.masterName||null), status:r.status||"alive"};
  });
  G.servantsLeft = G.roster.filter(function(r){ return r.status!=="dead"; }).length;
  var opening = "我已与「"+sv.className+"」职阶的英灵「"+sv.trueName+"」缔结契约（来源："+sv.sourceType+"）。请以圣杯AI主理人的身份开启战争。开幕要求：400-600字的完整开场大幕——①岁星的地平与夜色（殖民星穹顶外的星空、地下城的灯火与声啮）；②我现在所处的具体场景（地点、光线、气味、声音，我在做什么）；③复刻圣杯启动的异象与星联当局的阴影；④我与英灵的初次交流（体现其来源背景与性格）；⑤最后落到当下处境：第一夜已开始，给出本轮行动选项。新玩家没有任何背景预设，请让开幕本身就是一篇能独立读懂的引子。";

  if(isCmd){
    if(G.commandSpells <= 0){ alert("令咒已用尽。"); return; }

  }
  $("opts").innerHTML = "";
  $("log").insertAdjacentHTML("beforeend", '<div class="narration" style="border-color:var(--gold-soft);"><span class="stamp">御主决断</span>'+esc(label)+"</div>");
  doAITurn(label);
}
function sendCustom(){
  var v = $("custom-input").value.trim();
  if(!v) return;
  $("custom-input").value = "";
  $("opts").innerHTML = "";
  $("log").insertAdjacentHTML("beforeend", '<div class="narration" style="border-color:var(--gold-soft);"><span class="stamp">御主决断</span>'+esc(v)+"</div>");
  doAITurn(v);
}
var AI_BUSY = false;
function doAITurn(action){
  if(AI_BUSY) return;
  AI_BUSY = true;
  $("btn-send").disabled = true;
  $("log").insertAdjacentHTML("beforeend", '<div class="loading dots" id="gm-loading">圣杯AI正在裁定</div>');
  var msgs = buildMessages(action);
  callAI(msgs)
    .then(function(raw){
      $("gm-loading") && $("gm-loading").remove();
      var obj = tryParseGM(raw);
      var salvaged = false;
      if(!obj || !obj.narration){ obj = salvageGM(raw); salvaged = true; }
      if(!obj || !obj.narration){
        throw new Error("裁定失败：圣杯的回应无法解读（已尽力修复仍不合规）");
      }
      if(salvaged && !obj.state) obj.state = {};
      var prevScene = G.scene;
      var prevLocation = G.location;
      G = clampState(G, obj);
      G._options = clampOptions(obj, G);
      pushHistory("user", "玩家行动：" + action);
      pushHistory("assistant", JSON.stringify({narration:obj.narration, state:{scene:G.scene, masterHp:G.masterHp, servantHp:G.servantHp}, battle:G.battle}));
      renderTurn(obj.narration, prevScene, prevLocation);
      if(G.scene === "ending" && G.ending){ renderEnding(); }
      // 自动存档
      localStorage.setItem(SAVE_PREFIX+"auto", JSON.stringify(G));
    })
    .catch(function(e){
      $("gm-loading") && $("gm-loading").remove();
      $("log").insertAdjacentHTML("beforeend",
        '<div class="narration"><span class="err">'+esc(e.message||"未知错误")+'</span>'+
        '<p class="hint">可在「AI 通道」检查配置后重试本回合。</p></div>');
      var b = document.createElement("button");
      b.className = "opt"; b.textContent = "重试上一行动";
      b.onclick = function(){ b.remove(); doAITurn(action); };
      $("opts").innerHTML = ""; $("opts").appendChild(b);
    })
    .then(function(){ AI_BUSY = false; $("btn-send").disabled = false; });
}
function endWarConfirm(){
  if(G.scene === "ending") { renderEnding(); return; }
  if(confirm("确认请求圣杯提前终局裁决？战争将立即进入最终判定。")){
    $("opts").innerHTML = "";
    doAITurn("【系统指令】玩家请求圣杯立即终局：请给出最终决战/直接裁决，并输出 ending 字段完成整场战争的圣杯裁决。");
  }
}

/* ---------- 存档 ---------- */
function openSaves(){
  var box = $("save-slots");
  var html = "";
  ["1","2","3"].forEach(function(n){
    var raw = localStorage.getItem(SAVE_PREFIX+n);
    var info = "空";
    if(raw){ try{ var g = JSON.parse(raw); info = "第"+g.day+"天 "+g.phase+" · 回合"+g.turn+" · "+(g.servant?g.servant.trueName:""); }catch(e){ info="损坏"; } }
    html += '<div class="panel" style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;">'+
      '<span style="font-size:13.5px;">槽位 '+n+'：<span style="color:var(--dim)">'+esc(info)+'</span></span>'+
      '<span><button class="btn small primary" data-save="'+n+'">保存</button> '+
      '<button class="btn small" data-load="'+n+'" '+(raw?"":"disabled")+'>读取</button></span></div>';
  });
  html += '<p class="hint">另有自动存档（每回合覆盖）。继续战争=读取自动存档。</p>';
  box.innerHTML = html;
  box.querySelectorAll("[data-save]").forEach(function(b){
    b.onclick = function(){ localStorage.setItem(SAVE_PREFIX+b.getAttribute("data-save"), JSON.stringify(G)); openSaves(); };
  });
  box.querySelectorAll("[data-load]").forEach(function(b){
    b.onclick = function(){
      var raw = localStorage.getItem(SAVE_PREFIX+b.getAttribute("data-load"));
      try{
        G = JSON.parse(raw);
        G._options = [];
        closeModal("md-save");
        if(G.scene === "ending" && G.ending){ renderEnding(); }
        else { show("sc-game"); renderTurn("（战争记录已恢复——）"); }
      }catch(e){ alert("存档损坏"); }
    };
  });
  openModal("md-save");
}

/* ---------- 模态 & AI 设置 ---------- */
function openModal(id){ $(id).classList.add("on"); }
function closeModal(id){ $(id).classList.remove("on"); }
function openAISetup(){
  var s = loadSettings();
  $("ai-endpoint").value = s.endpoint||"";
  $("ai-key").value = s.key||"";
  $("ai-model").value = s.model||"";
  $("ai-test-err").textContent = "";
  openModal("md-ai");
}
function aiTest(){
  var s = {endpoint:$("ai-endpoint").value.trim(), key:$("ai-key").value.trim(), model:$("ai-model").value.trim()};
  if(!s.endpoint || !s.model){ $("ai-test-err").textContent = "请先填接口地址与模型名。"; return; }
  $("ai-test-err").textContent = "测试中…";
  var before = MOCK;
  fetch(endpointURL(s.endpoint), {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+(s.key||"")},
    body:JSON.stringify({model:s.model, messages:[{role:"user",content:"回复「通」一个字"}], max_tokens:8})
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){
    var t = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content || "(空)";
    $("ai-test-err").style.color = "var(--green)";
    $("ai-test-err").textContent = "连通成功，模型回复：" + t.slice(0,20);
  }).catch(function(e){
    $("ai-test-err").style.color = "var(--red)";
    $("ai-test-err").textContent = "失败：" + e.message;
  });
  void before;
}

/* ---------- 绑定 ---------- */
function bind(){
  $("btn-start").onclick = async function(){
    lockedModel = null;
    G = freshGame();
    // 开局即摇签：让召唤阶段就用上本局锁定的模型与文风
    var cloud = initCloud();
    if(cloud && !MOCK){
      try{ var usable = await fetchUsableModels(); ensureLockedModel(usable); if(G) G.lockedModel = lockedModel; }catch(e){}
    }
    beginDraw();
  };
  $("btn-continue").onclick = function(){
    var raw = localStorage.getItem(SAVE_PREFIX+"auto");
    if(!raw){ $("title-hint").textContent = "没有自动存档——先开始一场新的战争吧。"; return; }
    try{
      G = JSON.parse(raw); G._options = [];
      lockedModel = G.lockedModel || null; // 恢复本局锁定的主理模型，保证风格连贯
      if(G.scene === "ending" && G.ending){ renderEnding(); }
      else { show("sc-game"); renderTurn("（圣杯重新凝视着你——）"); }
    }catch(e){ $("title-hint").textContent = "自动存档损坏。"; }
  };
  $("btn-ai-setup").onclick = openAISetup;
  $("btn-ai-setup2").onclick = openAISetup;
  $("btn-lore").onclick = function(){ $("lore-body").textContent = LORE_TEXT; openModal("md-lore"); };
  // 游玩人数（云端统计，失败静默）
  loadVisitorStats().then(renderVisitorCount);
  // 插画包预热（标题页即后台缓存，触发时零延迟）
  preloadArt();
  $("btn-lore-close").onclick = function(){ closeModal("md-lore"); };
  $("btn-ai-save").onclick = function(){
    saveSettings({endpoint:$("ai-endpoint").value.trim(), key:$("ai-key").value.trim(), model:$("ai-model").value.trim()});
    $("ai-test-err").style.color = "var(--green)";
    $("ai-test-err").textContent = "已保存。";
  };
  $("btn-ai-test").onclick = aiTest;
  $("btn-ai-close").onclick = function(){ closeModal("md-ai"); };
  $("btn-save").onclick = openSaves;
  $("btn-save-close").onclick = function(){ closeModal("md-save"); };
  $("btn-end-war").onclick = endWarConfirm;
  $("btn-send").onclick = sendCustom;
  $("custom-input").addEventListener("keydown", function(e){ if(e.key === "Enter") sendCustom(); });
  $("btn-again").onclick = function(){ show("sc-title"); $("title-hint").textContent = "圣杯重新转动。"; };
  // 版本标记
  $("ver-mark").textContent = VER_MARK + (MOCK ? " · mock" : "");
  var s = loadSettings();
  if(window.PUBLIC_CONFIG && window.WorkBuddyCloud){
    $("title-hint").textContent = "云端 AI 已就绪（免密钥）——点击「开始战争」（也可加 ?mock=1 体验演示回合）。";
  } else if(!s.endpoint) $("title-hint").textContent = "提示：先在「AI 通道」填入你的 OpenAI 兼容接口与模型名，即可开始。（也可加 ?mock=1 体验演示回合）";
}
function makeStars(){
  var holder = $("stars"); if(!holder) return;
  var html = "";
  for(var i=0;i<90;i++){
    var s = (Math.random()*2+1).toFixed(1);
    html += '<span style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)+'%;width:'+s+'px;height:'+s+'px;animation-delay:'+(Math.random()*4).toFixed(2)+'s;animation-duration:'+(2.5+Math.random()*3).toFixed(2)+'s;"></span>';
  }
  holder.innerHTML = html;
}
bind();
makeStars();

if(window.PUBLIC_CONFIG && String(location.origin).indexOf("app.workbuddy.host") < 0){

  document.body.insertBefore(ban, document.body.firstChild);
}
